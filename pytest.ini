[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -p no:warnings
markers =
    weather: Tests for Weather REST API endpoints
    flight: Tests for Flight and Booking REST API endpoints
    sql_validation: Backend SQL data integrity and consistency tests
    positive: Positive operational scenarios and happy paths
    negative: Negative edge cases, validation errors, and boundary tests
    security: Authentication, authorization, and SQL injection tests
    sla: Performance and latency SLA compliance tests
